<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>가입 승인 관리 · 지티알 전자결의</title>
<style>
  :root {
    --ink: #1b2621; --paper: #f6f5f0; --card: #ffffff; --line: #e2e0d6;
    --green-deep: #1f4d3a; --green: #2f7a54; --green-soft: #e7f0e9;
    --red: #b5453f; --red-soft: #fbeceb;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); padding: 32px 20px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #7a8a80; margin: 0 0 24px; }
  .row {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .info b { font-size: 14px; }
  .info .meta { font-size: 12px; color: #7a8a80; margin-top: 3px; }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  button { border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .approve { background: var(--green-deep); color: #fff; }
  .reject { background: var(--red-soft); color: var(--red); }
  .empty { text-align: center; color: #9aa79e; padding: 60px 0; font-size: 14px; }
  .gate { max-width: 360px; margin: 80px auto; text-align: center; }
  .gate p { color: #7a8a80; font-size: 14px; }
  .section-title { font-size: 15px; font-weight: 700; margin: 36px 0 4px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .badge.draft { background: #eef0ee; color: #6b7a71; }
  .badge.pending { background: #fbf1de; color: #c98a2c; }
  .badge.approved { background: var(--green-soft); color: var(--green-deep); }
  .badge.rejected { background: var(--red-soft); color: var(--red); }
  .msg.show { display: block !important; }
  .msg.error { background: var(--red-soft); color: var(--red); }
  .msg.ok { background: var(--green-soft); color: var(--green-deep); }
</style>
</head>
<body>
<div class="wrap">
  <a href="/dashboard.html" style="display:inline-block; font-size:13px; color:var(--green-deep); text-decoration:underline; margin-bottom:16px;">← 대시보드로 돌아가기</a>
  <h1 id="add-emp-title">직원 추가</h1>
  <p class="sub" id="add-emp-sub">이름과 전화번호로 직원을 미리 등록해두면, 본인이 "최초 설정"에서 그 전화번호로 아이디/비밀번호를 만들어 바로 사용할 수 있습니다.</p>
  <div id="add-emp-form" style="background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:28px;">
    <input type="hidden" id="editing-emp-id" value="" />
    <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">이름</label>
    <input id="add-emp-name" style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; margin-bottom:12px; box-sizing:border-box;" />
    <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">전화번호</label>
    <input id="add-emp-phone" placeholder="010-0000-0000" style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; margin-bottom:12px; box-sizing:border-box;" />
    <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">소속 부서</label>
    <select id="add-emp-dept" style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; margin-bottom:12px; box-sizing:border-box;"><option value="">부서 선택 안 함</option></select>
    <div style="display:flex; gap:16px; margin-bottom:14px; font-size:13px;">
      <label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" id="add-emp-leader" style="width:auto;" /> 팀장</label>
      <label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" id="add-emp-dev" style="width:auto;" /> 개발이사</label>
      <label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" id="add-emp-acct" style="width:auto;" /> 회계담당</label>
    </div>
    <button class="approve" id="add-emp-submit-btn" onclick="submitEmployeeForm()">직원 추가</button>
    <button class="reject" id="add-emp-cancel-btn" onclick="cancelEditEmployee()" style="display:none;">취소</button>
    <div class="msg" id="add-emp-msg" style="margin-top:12px; font-size:13px; padding:10px 12px; border-radius:8px; display:none;"></div>
  </div>

  <h1>가입 승인 관리</h1>
  <p class="sub">가입은 이제 자동으로 승인됩니다. 이 목록은 과거 방식으로 남아있던 대기 건이 있을 때만 보입니다.</p>
  <div id="list"></div>

  <div class="section-title">전체 문서 관리</div>
  <p class="sub">상태와 관계없이 모든 문서를 삭제할 수 있습니다 (관리자 전용). 삭제하면 되돌릴 수 없습니다.</p>
  <div id="doc-list"></div>

  <div class="section-title">비밀번호 초기화</div>
  <p class="sub">아이디/비밀번호를 잊어버린 직원을 검색해서 비밀번호를 새로 지정할 수 있습니다.</p>
  <input id="emp-search" placeholder="이름, 아이디, 전화번호로 검색" style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; margin-bottom:12px; box-sizing:border-box;" />
  <div id="emp-list"></div>
</div>

<script>
  const token = localStorage.getItem('gtr_approval_token');
  if (!token) {
    document.body.innerHTML = '<div class="gate"><h1>로그인이 필요합니다</h1><p>관리자 계정으로 먼저 로그인해주세요.</p></div>';
  }
  const statusLabel = { draft: '임시저장', pending: '진행중', approved: '승인완료', rejected: '반려' };

  async function load() {
    const res = await fetch('/api/admin/pending-employees', {
      headers: { Authorization: 'Bearer ' + token },
    });
    const data = await res.json();
    const list = document.getElementById('list');
    if (!res.ok) {
      list.innerHTML = '<div class="empty">' + (data.error || '조회에 실패했습니다.') + '</div>';
      return;
    }
    if (!data.pending || data.pending.length === 0) {
      list.innerHTML = '<div class="empty">승인 대기 중인 가입 신청이 없습니다.</div>';
      return;
    }
    list.innerHTML = data.pending.map(p => `
      <div class="row" data-id="${p.id}">
        <div class="info">
          <b>${p.name}</b> <span style="color:#9aa79e;">(${p.login_id})</span>
          <div class="meta">신청일: ${new Date(p.created_at).toLocaleString('ko-KR')}</div>
        </div>
        <div class="actions">
          <button class="approve" onclick="act('${p.id}','approve')">승인</button>
          <button class="reject" onclick="act('${p.id}','reject')">반려</button>
        </div>
      </div>
    `).join('');
  }

  async function act(employee_id, action) {
    const res = await fetch('/api/admin/pending-employees', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ employee_id, action }),
    });
    if (res.ok) load();
    else alert('처리 중 오류가 발생했습니다.');
  }

  async function loadDocs() {
    const res = await fetch('/api/admin/documents', { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    const list = document.getElementById('doc-list');
    if (!res.ok) {
      list.innerHTML = '<div class="empty">' + (data.error || '조회에 실패했습니다.') + '</div>';
      return;
    }
    if (!data.documents || data.documents.length === 0) {
      list.innerHTML = '<div class="empty">등록된 문서가 없습니다.</div>';
      return;
    }
    list.innerHTML = data.documents.map((d) => {
      const typeName = d.approval_doc_types ? d.approval_doc_types.name : '';
      const drafterName = d.approval_employees ? d.approval_employees.name : '';
      return `
        <div class="row" data-id="${d.id}">
          <div class="info">
            <b>${d.title}</b>
            <span class="badge ${d.status}" style="margin-left:8px;">${statusLabel[d.status] || d.status}</span>
            <div class="meta">${typeName} · 작성자: ${drafterName} · ${new Date(d.created_at).toLocaleString('ko-KR')}</div>
          </div>
          <div class="actions">
            <button class="reject" onclick="deleteDoc('${d.id}')">삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function deleteDoc(document_id) {
    if (!confirm('이 문서를 삭제하시겠습니까? 상태와 관계없이 완전히 삭제되며 되돌릴 수 없습니다.')) return;
    const res = await fetch('/api/documents/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ document_id }),
    });
    const data = await res.json();
    if (res.ok) loadDocs();
    else alert(data.error || '삭제 중 오류가 발생했습니다.');
  }

  if (token) { load(); loadDocs(); loadEmployees(); loadAddEmpDepartments(); }

  async function loadAddEmpDepartments() {
    const res = await fetch('/api/admin/departments', { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    if (!res.ok) return;
    const sel = document.getElementById('add-emp-dept');
    (data.departments || []).forEach((d) => {
      const opt = document.createElement('option');
      opt.value = d.id;
      opt.textContent = d.name;
      sel.appendChild(opt);
    });
  }

  function startEditEmployee(e) {
    document.getElementById('editing-emp-id').value = e.id;
    document.getElementById('add-emp-name').value = e.name || '';
    document.getElementById('add-emp-phone').value = e.phone || '';
    document.getElementById('add-emp-dept').value = e.department_id || (e.approval_departments ? '' : '');
    document.getElementById('add-emp-leader').checked = !!e.is_team_leader;
    document.getElementById('add-emp-dev').checked = !!e.is_dev_director;
    document.getElementById('add-emp-acct').checked = !!e.is_accounting_reviewer;
    document.getElementById('add-emp-title').textContent = `${e.name}님 정보 수정`;
    document.getElementById('add-emp-sub').textContent = '이름, 전화번호, 부서, 역할을 수정할 수 있습니다.';
    document.getElementById('add-emp-submit-btn').textContent = '저장';
    document.getElementById('add-emp-cancel-btn').style.display = 'inline-block';
    document.getElementById('add-emp-msg').className = 'msg';
    document.getElementById('add-emp-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function cancelEditEmployee() {
    document.getElementById('editing-emp-id').value = '';
    document.getElementById('add-emp-name').value = '';
    document.getElementById('add-emp-phone').value = '';
    document.getElementById('add-emp-dept').value = '';
    document.getElementById('add-emp-leader').checked = false;
    document.getElementById('add-emp-dev').checked = false;
    document.getElementById('add-emp-acct').checked = false;
    document.getElementById('add-emp-title').textContent = '직원 추가';
    document.getElementById('add-emp-sub').textContent = '이름과 전화번호로 직원을 미리 등록해두면, 본인이 "최초 설정"에서 그 전화번호로 아이디/비밀번호를 만들어 바로 사용할 수 있습니다.';
    document.getElementById('add-emp-submit-btn').textContent = '직원 추가';
    document.getElementById('add-emp-cancel-btn').style.display = 'none';
    document.getElementById('add-emp-msg').className = 'msg';
  }

  async function submitEmployeeForm() {
    const editingId = document.getElementById('editing-emp-id').value;
    const name = document.getElementById('add-emp-name').value.trim();
    const phone = document.getElementById('add-emp-phone').value.trim();
    const department_id = document.getElementById('add-emp-dept').value || null;
    const is_team_leader = document.getElementById('add-emp-leader').checked;
    const is_dev_director = document.getElementById('add-emp-dev').checked;
    const is_accounting_reviewer = document.getElementById('add-emp-acct').checked;
    const msgEl = document.getElementById('add-emp-msg');

    if (!name || (!editingId && !phone)) {
      msgEl.textContent = editingId ? '이름을 입력해주세요.' : '이름과 전화번호를 입력해주세요.';
      msgEl.className = 'msg show error';
      return;
    }

    const url = editingId ? '/api/admin/update-employee' : '/api/admin/add-employee';
    const body = editingId
      ? { employee_id: editingId, name, phone, department_id, is_team_leader, is_dev_director, is_accounting_reviewer }
      : { name, phone, department_id, is_team_leader, is_dev_director, is_accounting_reviewer };

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (res.ok) {
      msgEl.textContent = data.message;
      msgEl.className = 'msg show ok';
      if (editingId) {
        cancelEditEmployee();
      } else {
        document.getElementById('add-emp-name').value = '';
        document.getElementById('add-emp-phone').value = '';
        document.getElementById('add-emp-dept').value = '';
        document.getElementById('add-emp-leader').checked = false;
        document.getElementById('add-emp-dev').checked = false;
        document.getElementById('add-emp-acct').checked = false;
      }
      loadEmployees();
    } else {
      msgEl.textContent = data.error || '처리 중 오류가 발생했습니다.';
      msgEl.className = 'msg show error';
    }
  }

  const addEmpPhoneInput = document.getElementById('add-emp-phone');
  if (addEmpPhoneInput) {
    addEmpPhoneInput.addEventListener('input', (e) => {
      let digits = e.target.value.replace(/\D/g, '').slice(0, 11);
      let formatted = digits;
      if (digits.length > 3 && digits.length <= 7) {
        formatted = digits.slice(0, 3) + '-' + digits.slice(3);
      } else if (digits.length > 7) {
        formatted = digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7);
      }
      e.target.value = formatted;
    });
  }

  let allEmployees = [];
  async function loadEmployees() {
    const res = await fetch('/api/admin/employees', { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    if (!res.ok) {
      document.getElementById('emp-list').innerHTML = '<div class="empty">' + (data.error || '직원 목록을 불러오지 못했습니다.') + '</div>';
      return;
    }
    allEmployees = data.employees || [];
    renderEmployees(allEmployees);
  }

  function renderEmployees(list) {
    const el = document.getElementById('emp-list');
    if (list.length === 0) {
      el.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
      return;
    }
    el.innerHTML = list.slice(0, 50).map((e) => {
      const dept = e.approval_departments ? e.approval_departments.name : '';
      const idText = e.login_id ? e.login_id : '(아직 미설정)';
      return `
        <div class="row" data-id="${e.id}" style="${e.is_active ? '' : 'opacity:.5;'}">
          <div class="info">
            <b>${e.name}</b> <span style="color:#9aa79e;">(${idText})</span> ${e.is_active ? '' : '<span class="badge rejected">비활성</span>'}
            <div class="meta">${dept || '-'} · ${e.phone || '전화번호 없음'} · 연차 ${e.annual_leave_days != null ? e.annual_leave_days + '일' : '미설정'}</div>
          </div>
          <div class="actions">
            <button class="approve" onclick='startEditEmployee(${JSON.stringify(e)})'>정보 수정</button>
            ${e.login_id ? `<button class="approve" onclick="resetPassword('${e.id}')">비밀번호 초기화</button>` : ''}
            ${e.phone ? `<button class="reject" onclick="resetActivation('${e.id}')">최초설정 초기화</button>` : ''}
            <button class="approve" onclick="setLeaveDays('${e.id}', ${e.annual_leave_days != null ? e.annual_leave_days : 15})">연차 설정</button>
            <button class="reject" onclick="toggleActive('${e.id}')">${e.is_active ? '비활성화' : '활성화'}</button>
            <button class="reject" onclick="deleteEmployee('${e.id}', '${e.name}')" style="background:#f2d6d5;">완전삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('emp-search').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) return renderEmployees(allEmployees);
    const filtered = allEmployees.filter((emp) =>
      (emp.name || '').toLowerCase().includes(q) ||
      (emp.login_id || '').toLowerCase().includes(q) ||
      (emp.phone || '').includes(q)
    );
    renderEmployees(filtered);
  });

  async function resetPassword(employee_id) {
    const custom = prompt('새 비밀번호를 입력하세요 (6자 이상). 비워두면 자동으로 만들어드립니다.');
    if (custom === null) return; // 취소
    if (custom && custom.length > 0 && custom.length < 6) {
      alert('비밀번호는 6자 이상이어야 합니다.');
      return;
    }
    const res = await fetch('/api/admin/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ employee_id, new_password: custom || undefined }),
    });
    const data = await res.json();
    if (res.ok) {
      alert(`아이디: ${data.login_id}\n새 비밀번호: ${data.new_password}\n\n이 내용을 해당 직원에게 전달해주세요.`);
    } else {
      alert(data.error || '초기화 중 오류가 발생했습니다.');
    }
  }
  async function resetActivation(employee_id) {
    if (!confirm('이 직원의 아이디/비밀번호를 지우고, 전화번호로 "최초 설정"을 처음부터 다시 하게 만드시겠습니까?')) return;
    const res = await fetch('/api/admin/reset-activation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ employee_id }),
    });
    const data = await res.json();
    if (res.ok) {
      alert(data.message);
      loadEmployees();
    } else {
      alert(data.error || '초기화 중 오류가 발생했습니다.');
    }
  }
  async function setLeaveDays(employee_id, current) {
    const input = prompt('연간 연차 일수를 입력하세요 (숫자만)', current);
    if (input === null) return;
    const days = Number(input);
    if (isNaN(days) || days < 0) return alert('올바른 숫자를 입력해주세요.');
    const res = await fetch('/api/admin/set-leave-days', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ employee_id, annual_leave_days: days }),
    });
    const data = await res.json();
    if (res.ok) loadEmployees();
    else alert(data.error || '설정 중 오류가 발생했습니다.');
  }
  async function toggleActive(employee_id) {
    if (!confirm('이 계정의 활성 상태를 변경하시겠습니까?')) return;
    const res = await fetch('/api/admin/toggle-active', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ employee_id }),
    });
    const data = await res.json();
    if (res.ok) loadEmployees();
    else alert(data.error || '처리 중 오류가 발생했습니다.');
  }
  async function deleteEmployee(employee_id, name) {
    if (!confirm(`${name}님 계정을 완전히 삭제하시겠습니까?\n(작성했거나 결재했던 문서가 있으면 삭제가 거부됩니다. 되돌릴 수 없습니다.)`)) return;
    const res = await fetch('/api/admin/delete-employee', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ employee_id }),
    });
    const data = await res.json();
    if (res.ok) {
      alert(data.message);
      loadEmployees();
    } else {
      alert(data.error || '삭제 중 오류가 발생했습니다.');
    }
  }
</script>
</body>
</html>
