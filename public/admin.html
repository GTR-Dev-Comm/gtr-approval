<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>가입 승인 관리 · 지티알 전자결의</title>
<style>
  :root {
    --ink: #1b2621; --paper: #f6f5f0; --card: #ffffff; --line: #e2e0d6;
    --green-deep: #1f4d3a; --green: #2f7a54; --green-soft: #e7f0e9;
    --red: #b5453f; --red-soft: #fbeceb;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); padding: 32px 20px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #7a8a80; margin: 0 0 24px; }
  .row {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .info b { font-size: 14px; }
  .info .meta { font-size: 12px; color: #7a8a80; margin-top: 3px; }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  button { border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .approve { background: var(--green-deep); color: #fff; }
  .reject { background: var(--red-soft); color: var(--red); }
  .empty { text-align: center; color: #9aa79e; padding: 60px 0; font-size: 14px; }
  .gate { max-width: 360px; margin: 80px auto; text-align: center; }
  .gate p { color: #7a8a80; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>가입 승인 관리</h1>
  <p class="sub">가입 신청한 직원을 승인하거나 반려할 수 있습니다.</p>
  <div id="list"></div>
</div>

<script>
  const token = localStorage.getItem('gtr_approval_token');
  if (!token) {
    document.body.innerHTML = '<div class="gate"><h1>로그인이 필요합니다</h1><p>관리자 계정으로 먼저 로그인해주세요.</p></div>';
  }

  async function load() {
    const res = await fetch('/api/admin/pending-employees', {
      headers: { Authorization: 'Bearer ' + token },
    });
    const data = await res.json();
    const list = document.getElementById('list');
    if (!res.ok) {
      list.innerHTML = '<div class="empty">' + (data.error || '조회에 실패했습니다.') + '</div>';
      return;
    }
    if (!data.pending || data.pending.length === 0) {
      list.innerHTML = '<div class="empty">승인 대기 중인 가입 신청이 없습니다.</div>';
      return;
    }
    list.innerHTML = data.pending.map(p => `
      <div class="row" data-id="${p.id}">
        <div class="info">
          <b>${p.name}</b> <span style="color:#9aa79e;">(${p.login_id})</span>
          <div class="meta">신청일: ${new Date(p.created_at).toLocaleString('ko-KR')}</div>
        </div>
        <div class="actions">
          <button class="approve" onclick="act('${p.id}','approve')">승인</button>
          <button class="reject" onclick="act('${p.id}','reject')">반려</button>
        </div>
      </div>
    `).join('');
  }

  async function act(employee_id, action) {
    const res = await fetch('/api/admin/pending-employees', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ employee_id, action }),
    });
    if (res.ok) load();
    else alert('처리 중 오류가 발생했습니다.');
  }

  if (token) load();
</script>
</body>
</html>
