<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>지티알 전자결의</title>
<style>
  :root {
    --ink: #1b2621; --paper: #f6f5f0; --card: #ffffff; --line: #e2e0d6;
    --green-deep: #1f4d3a; --green: #2f7a54; --green-soft: #e7f0e9;
    --amber: #c98a2c; --amber-soft: #fbf1de;
    --red: #b5453f; --red-soft: #fbeceb;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--green), var(--green-deep));
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px;
  }
  .brand .name { font-size: 14px; font-weight: 700; }
  .who { font-size: 13px; color: #6b7a71; }
  .logout { font-size: 12px; color: #9aa79e; cursor: pointer; margin-left: 12px; text-decoration: underline; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 20px; }

  .tabs { display: flex; gap: 4px; background: var(--green-soft); padding: 4px; border-radius: 10px; margin-bottom: 20px; }
  .tab { flex: 1; text-align: center; padding: 9px 0; border-radius: 7px; font-size: 13px; font-weight: 600; color: #4c6a58; cursor: pointer; }
  .tab.active { background: var(--green-deep); color: #fff; }
  .panel { display: none; }
  .panel.active { display: block; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: #33413a; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px;
    font-size: 14px; background: #fbfbf9; color: var(--ink); outline: none; font-family: inherit;
  }
  textarea { min-height: 80px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--green); background: #fff; }

  button.primary {
    padding: 11px 18px; border: none; border-radius: 9px; background: var(--green-deep);
    color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button.ghost {
    padding: 9px 14px; border: 1px solid var(--line); border-radius: 9px; background: #fff;
    color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button.reject { background: var(--red-soft); color: var(--red); border: none; }
  button.approve { background: var(--green-deep); color: #fff; border: none; }

  .file-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .file-list { font-size: 12px; color: #6b7a71; margin-top: 6px; }

  .doc {
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; background: #fff;
  }
  .doc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .doc-title { font-size: 14px; font-weight: 700; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .badge.pending { background: var(--amber-soft); color: var(--amber); }
  .badge.approved { background: var(--green-soft); color: var(--green-deep); }
  .badge.rejected { background: var(--red-soft); color: var(--red); }
  .doc-meta { font-size: 12px; color: #9aa79e; margin-top: 4px; }
  .doc-steps { margin-top: 10px; font-size: 12px; color: #4c6a58; display: flex; gap: 6px; flex-wrap: wrap; }
  .step-chip { padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .step-chip.approved { border-color: var(--green); color: var(--green-deep); }
  .step-chip.rejected { border-color: var(--red); color: var(--red); }
  .step-chip.waiting { border-color: var(--amber); color: var(--amber); }

  .empty { text-align: center; color: #9aa79e; padding: 40px 0; font-size: 13px; }
  .msg { margin-top: 12px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
  .msg.show { display: block; }
  .msg.error { background: var(--red-soft); color: var(--red); }
  .msg.ok { background: var(--green-soft); color: var(--green-deep); }
  .item-card {
    border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 12px; background: #fbfbf9; position: relative;
  }
  .item-card .item-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 4px; }
  .item-card .item-num { font-size: 12px; font-weight: 700; color: var(--green-deep); }
  .item-remove { font-size: 12px; color: var(--red); cursor: pointer; background:none; border:none; padding:0; }
  #preview-body .p-item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  #preview-body .p-row { display:flex; justify-content:space-between; gap:10px; padding: 3px 0; }
  #preview-body .p-row .k { color:#7a8a80; }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark">GTR</div><div class="name">전자결의</div></div>
  <div class="who"><span id="who-name"></span><span class="logout" id="logout-btn">로그아웃</span></div>
</header>

<div class="wrap">
  <div class="tabs">
    <div class="tab active" data-panel="new">새 문서 작성</div>
    <div class="tab" data-panel="my">내 문서</div>
    <div class="tab" data-panel="approve">결재할 문서</div>
  </div>

  <!-- 새 문서 작성 -->
  <div class="panel active" id="panel-new">
    <div class="card">
      <label>문서 종류</label>
      <select id="doc-type-select"></select>

      <div id="items-container"></div>
      <button class="ghost" id="add-item-btn" style="margin-top:10px;">+ 항목 추가</button>

      <div id="attachment-area" style="display:none;">
        <label>영수증 첨부 (사진 또는 PDF, 여러 장 가능)</label>
        <input type="file" id="file-input" accept="image/jpeg,image/png,application/pdf" multiple />
        <div class="file-list" id="file-list"></div>
      </div>

      <div style="display:flex; gap:8px; margin-top:18px;">
        <button class="ghost" id="preview-btn">미리보기</button>
        <button class="primary" id="submit-btn" disabled title="먼저 미리보기를 확인해주세요">상신하기</button>
      </div>
      <div class="msg" id="new-msg"></div>
    </div>
  </div>

  <!-- 미리보기 모달 -->
  <div id="preview-modal" style="display:none; position:fixed; inset:0; background:rgba(27,38,33,.45); z-index:50; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#fff; border-radius:14px; max-width:520px; width:100%; max-height:80vh; overflow-y:auto; padding:22px;">
      <h2 style="font-size:16px; margin:0 0 14px;">문서 미리보기</h2>
      <div id="preview-body" style="font-size:13px; line-height:1.7;"></div>
      <div style="display:flex; gap:8px; margin-top:20px;">
        <button class="ghost" id="preview-close-btn">수정하기</button>
        <button class="primary" id="preview-submit-btn">이 내용으로 상신하기</button>
      </div>
    </div>
  </div>

  <!-- 내 문서 -->
  <div class="panel" id="panel-my">
    <div id="my-list"></div>
  </div>

  <!-- 결재할 문서 -->
  <div class="panel" id="panel-approve">
    <div id="approve-list"></div>
  </div>
</div>

<script>
  const token = localStorage.getItem('gtr_approval_token');
  const employeeRaw = localStorage.getItem('gtr_approval_employee');
  if (!token) window.location.href = '/index.html';
  const employee = employeeRaw ? JSON.parse(employeeRaw) : {};
  document.getElementById('who-name').textContent = (employee.name || '') + '님';

  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('gtr_approval_token');
    localStorage.removeItem('gtr_approval_employee');
    window.location.href = '/index.html';
  });

  function authHeaders(json) {
    const h = { Authorization: 'Bearer ' + token };
    if (json) h['Content-Type'] = 'application/json';
    return h;
  }

  // ---------- 탭 전환 ----------
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.panel');
  tabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      tabs.forEach((t) => t.classList.remove('active'));
      panels.forEach((p) => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
      if (tab.dataset.panel === 'my') loadMyDocuments();
      if (tab.dataset.panel === 'approve') loadPendingApprovals();
    });
  });

  // ---------- 새 문서 작성 ----------
  let docTypes = [];
  let selectedFiles = [];
  let items = [{}]; // 각 항목의 입력값 { fieldKey: value }

  async function loadDocTypes() {
    const res = await fetch('/api/doc-types', { headers: authHeaders() });
    const data = await res.json();
    docTypes = data.doc_types || [];
    const sel = document.getElementById('doc-type-select');
    sel.innerHTML = '';
    docTypes.forEach((dt) => {
      const opt = document.createElement('option');
      opt.value = dt.code;
      opt.textContent = dt.name;
      sel.appendChild(opt);
    });
    resetItems();
  }

  function currentDocType() {
    const code = document.getElementById('doc-type-select').value;
    return docTypes.find((d) => d.code === code);
  }

  function resetItems() {
    items = [{}];
    renderItems();
    const dt = currentDocType();
    const attArea = document.getElementById('attachment-area');
    attArea.style.display = dt && dt.form_schema.attachments ? 'block' : 'none';
    selectedFiles = [];
    document.getElementById('file-list').textContent = '';
    document.getElementById('file-input').value = '';
    document.getElementById('submit-btn').disabled = true;
  }

  function renderItems() {
    const dt = currentDocType();
    const container = document.getElementById('items-container');
    container.innerHTML = '';
    if (!dt) return;
    const fields = dt.form_schema.fields || [];

    items.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'item-card';

      const head = document.createElement('div');
      head.className = 'item-head';
      const num = document.createElement('div');
      num.className = 'item-num';
      num.textContent = `${dt.name} #${idx + 1}`;
      head.appendChild(num);
      if (items.length > 1) {
        const rm = document.createElement('button');
        rm.className = 'item-remove';
        rm.textContent = '삭제';
        rm.addEventListener('click', () => { items.splice(idx, 1); renderItems(); });
        head.appendChild(rm);
      }
      card.appendChild(head);

      fields.forEach((f) => {
        const label = document.createElement('label');
        label.textContent = f.label + (f.required ? ' *' : '');
        card.appendChild(label);

        let input;
        if (f.type === 'textarea') {
          input = document.createElement('textarea');
        } else if (f.type === 'select') {
          input = document.createElement('select');
          (f.options || []).forEach((o) => {
            const opt = document.createElement('option');
            opt.value = o; opt.textContent = o;
            input.appendChild(opt);
          });
        } else {
          input = document.createElement('input');
          input.type = f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text');
        }
        input.value = item[f.key] || '';
        input.addEventListener('input', () => { items[idx][f.key] = input.value; });
        input.addEventListener('change', () => { items[idx][f.key] = input.value; });
        card.appendChild(input);
      });

      container.appendChild(card);
    });

    document.getElementById('submit-btn').disabled = true; // 항목이 바뀌면 다시 미리보기부터
  }

  document.getElementById('doc-type-select').addEventListener('change', resetItems);
  document.getElementById('add-item-btn').addEventListener('click', () => {
    items.push({});
    renderItems();
  });

  document.getElementById('file-input').addEventListener('change', (e) => {
    selectedFiles = Array.from(e.target.files);
    document.getElementById('file-list').textContent =
      selectedFiles.length > 0 ? selectedFiles.map((f) => f.name).join(', ') + ' 선택됨' : '';
    document.getElementById('submit-btn').disabled = true;
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function showMsg(id, text, ok) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg show ' + (ok ? 'ok' : 'error');
  }

  function validateItems(dt) {
    for (const item of items) {
      for (const f of dt.form_schema.fields || []) {
        if (f.required && !item[f.key]) return false;
      }
    }
    if (dt.form_schema.attachments && dt.form_schema.attachments.required && selectedFiles.length === 0) {
      return false;
    }
    return true;
  }

  document.getElementById('preview-btn').addEventListener('click', () => {
    const dt = currentDocType();
    if (!dt) return;
    if (!validateItems(dt)) {
      showMsg('new-msg', '필수 항목을 모두 입력해주세요 (영수증 첨부 포함).', false);
      return;
    }
    document.getElementById('new-msg').className = 'msg';

    const body = document.getElementById('preview-body');
    let html = `<div class="p-item"><div class="p-row"><span class="k">문서 종류</span><span>${dt.name}</span></div>` +
      `<div class="p-row"><span class="k">기안자</span><span>${employee.name}</span></div>` +
      `<div class="p-row"><span class="k">첨부파일</span><span>${selectedFiles.length > 0 ? selectedFiles.map(f=>f.name).join(', ') : '없음'}</span></div></div>`;

    items.forEach((item, idx) => {
      html += `<div class="p-item"><div class="p-row"><span class="k">항목 #${idx + 1}</span><span></span></div>`;
      (dt.form_schema.fields || []).forEach((f) => {
        html += `<div class="p-row"><span class="k">${f.label}</span><span>${item[f.key] || '-'}</span></div>`;
      });
      html += `</div>`;
    });

    body.innerHTML = html;
    document.getElementById('preview-modal').style.display = 'flex';
    document.getElementById('submit-btn').disabled = false;
  });

  document.getElementById('preview-close-btn').addEventListener('click', () => {
    document.getElementById('preview-modal').style.display = 'none';
  });

  async function submitDocument() {
    const dt = currentDocType();
    if (!dt) return;
    if (!validateItems(dt)) {
      showMsg('new-msg', '필수 항목을 모두 입력해주세요.', false);
      return;
    }

    const title = `${dt.name} - ${employee.name} - ${new Date().toLocaleDateString('ko-KR')}`;
    const content = { items };

    try {
      const res = await fetch('/api/documents/create', {
        method: 'POST',
        headers: authHeaders(true),
        body: JSON.stringify({ doc_type_code: dt.code, title, content }),
      });
      const data = await res.json();
      if (!res.ok) return showMsg('new-msg', data.error || '상신에 실패했습니다.', false);

      for (const file of selectedFiles) {
        const base64 = await fileToBase64(file);
        const fileType = file.type === 'application/pdf' ? 'pdf' : 'image';
        await fetch('/api/attachments/upload', {
          method: 'POST',
          headers: authHeaders(true),
          body: JSON.stringify({
            document_id: data.document_id,
            file_name: file.name,
            file_type: fileType,
            data_base64: base64,
          }),
        });
      }

      document.getElementById('preview-modal').style.display = 'none';
      showMsg('new-msg', '상신이 완료되었습니다.', true);
      resetItems();
    } catch (e) {
      showMsg('new-msg', '네트워크 오류가 발생했습니다.', false);
    }
  }

  document.getElementById('submit-btn').addEventListener('click', submitDocument);
  document.getElementById('preview-submit-btn').addEventListener('click', submitDocument);

  // ---------- 내 문서 ----------
  const statusLabel = { pending: '진행중', approved: '승인완료', rejected: '반려' };
  const stepStatusLabel = { pending: '대기', waiting: '결재중', approved: '승인', rejected: '반려' };

  async function loadMyDocuments() {
    const listEl = document.getElementById('my-list');
    listEl.innerHTML = '<div class="empty">불러오는 중...</div>';
    const res = await fetch('/api/documents/my', { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) { listEl.innerHTML = '<div class="empty">' + (data.error || '조회 실패') + '</div>'; return; }
    if (!data.documents || data.documents.length === 0) {
      listEl.innerHTML = '<div class="empty">아직 상신한 문서가 없습니다.</div>';
      return;
    }
    listEl.innerHTML = data.documents.map((d) => `
      <div class="doc">
        <div class="doc-top">
          <div class="doc-title">${d.title}</div>
          <div class="badge ${d.status}">${statusLabel[d.status] || d.status}</div>
        </div>
        <div class="doc-meta">${new Date(d.created_at).toLocaleString('ko-KR')}</div>
        <div class="doc-steps">
          ${(d.steps || []).map((s) => `<span class="step-chip ${s.status}">${s.step_name}: ${stepStatusLabel[s.status] || s.status}</span>`).join('')}
        </div>
      </div>
    `).join('');
  }

  // ---------- 결재할 문서 ----------
  async function loadPendingApprovals() {
    const listEl = document.getElementById('approve-list');
    listEl.innerHTML = '<div class="empty">불러오는 중...</div>';
    const res = await fetch('/api/documents/pending', { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) { listEl.innerHTML = '<div class="empty">' + (data.error || '조회 실패') + '</div>'; return; }
    if (!data.pending || data.pending.length === 0) {
      listEl.innerHTML = '<div class="empty">결재할 문서가 없습니다.</div>';
      return;
    }
    listEl.innerHTML = data.pending.map((s) => {
      const doc = s.approval_documents;
      const drafterName = doc && doc.approval_employees ? doc.approval_employees.name : '';
      const typeName = doc && doc.approval_doc_types ? doc.approval_doc_types.name : '';
      const items = doc && doc.content && Array.isArray(doc.content.items) ? doc.content.items : [];
      const itemsHtml = items.map((item, idx) =>
        `<div style="margin-top:6px; padding:8px 10px; background:var(--paper); border-radius:8px;">` +
        `<div style="font-weight:700; font-size:11px; color:var(--green-deep); margin-bottom:2px;">항목 #${idx + 1}</div>` +
        Object.entries(item).map(([k, v]) => `<div style="font-size:12px; color:#4c6a58;">${k}: ${v}</div>`).join('') +
        `</div>`
      ).join('');
      return `
        <div class="doc">
          <div class="doc-top">
            <div class="doc-title">${doc ? doc.title : ''}</div>
            <div class="badge pending">${s.step_name}</div>
          </div>
          <div class="doc-meta">${typeName} · 기안자: ${drafterName}</div>
          ${itemsHtml}
          <div style="margin-top:10px; display:flex; gap:8px;">
            <button class="approve" onclick="act(${s.id}, 'approve')">승인</button>
            <button class="reject" onclick="act(${s.id}, 'reject')">반려</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function act(step_id, action) {
    let comment = null;
    if (action === 'reject') {
      comment = prompt('반려 사유를 입력해주세요 (선택)');
    }
    const res = await fetch('/api/documents/act', {
      method: 'POST',
      headers: authHeaders(true),
      body: JSON.stringify({ step_id, action, comment }),
    });
    if (res.ok) loadPendingApprovals();
    else alert('처리 중 오류가 발생했습니다.');
  }

  loadDocTypes();
</script>
</body>
</html>
