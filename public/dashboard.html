<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>지티알 전자결의</title>
<style>
  :root {
    --ink: #1b2621; --paper: #f6f5f0; --card: #ffffff; --line: #e2e0d6;
    --green-deep: #1f4d3a; --green: #2f7a54; --green-soft: #e7f0e9;
    --amber: #c98a2c; --amber-soft: #fbf1de;
    --red: #b5453f; --red-soft: #fbeceb;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--green), var(--green-deep));
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px;
  }
  .brand .name { font-size: 14px; font-weight: 700; }
  .who { font-size: 13px; color: #6b7a71; }
  .logout { font-size: 12px; color: #9aa79e; cursor: pointer; margin-left: 12px; text-decoration: underline; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 20px; }

  .tabs { display: flex; gap: 4px; background: var(--green-soft); padding: 4px; border-radius: 10px; margin-bottom: 20px; }
  .tab { flex: 1; text-align: center; padding: 9px 0; border-radius: 7px; font-size: 13px; font-weight: 600; color: #4c6a58; cursor: pointer; }
  .tab.active { background: var(--green-deep); color: #fff; }
  .panel { display: none; }
  .panel.active { display: block; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 12px; }

  .doctype-picker { display: flex; gap: 8px; margin-bottom: 16px; }
  .doctype-btn {
    flex: 1; padding: 12px 6px; text-align: center; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; font-size: 13px; font-weight: 700; cursor: pointer; color: #4c6a58;
  }
  .doctype-btn.active { background: var(--green-deep); color: #fff; border-color: var(--green-deep); }

  button.primary {
    padding: 11px 18px; border: none; border-radius: 9px; background: var(--green-deep);
    color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button.ghost {
    padding: 9px 14px; border: 1px solid var(--line); border-radius: 9px; background: #fff;
    color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button.reject { background: var(--red-soft); color: var(--red); border: none; }
  button.approve { background: var(--green-deep); color: #fff; border: none; }
  button.row-add { margin-top: 8px; }
  button.row-del { background: none; border: none; color: var(--red); font-size: 16px; cursor: pointer; line-height: 1; padding: 2px 6px; }

  .file-list { font-size: 12px; color: #6b7a71; margin-top: 6px; }
  input[type="file"] { font-size: 13px; }

  /* ---- 종이 양식 스타일 ---- */
  .paper-form {
    border: 2px solid #222; border-radius: 2px; overflow: hidden; background: #fff; font-size: 13px;
    max-width: 800px; margin: 0 auto; box-shadow: 0 4px 18px rgba(27,38,33,.10);
  }
  .paper-form table { width: 100%; border-collapse: collapse; }
  .paper-form td, .paper-form th { border: 1px solid #444; padding: 7px 9px; vertical-align: middle; }
  .paper-form td.label {
    background: #dfe9e3; font-weight: 700; text-align: center; width: 100px; white-space: nowrap; font-size: 12px;
  }
  .paper-form th { background: #dfe9e3; font-size: 12px; }
  .paper-form .title-row td { border: none; padding: 0; }
  .paper-form .title-cell { font-size: 24px; font-weight: 800; text-align: center; padding: 22px 10px; letter-spacing: 4px; }
  .paper-form .approval-table { border-collapse: collapse; }
  .paper-form .approval-table td { text-align: center; font-size: 11px; padding: 4px 8px; }
  .paper-form .approval-table td.role { background: #f2f2f2; font-weight: 700; height: 18px; }
  .paper-form .approval-table td.stamp { height: 40px; min-width: 56px; color: #9aa79e; }
  .paper-form input, .paper-form textarea, .paper-form select {
    border: none; background: transparent; width: 100%; font-size: 13px; padding: 2px 3px; font-family: inherit; outline: none;
  }
  .paper-form input:focus, .paper-form textarea:focus, .paper-form select:focus { background: var(--green-soft); }
  .paper-form input[readonly] { color: #6b7a71; }
  .paper-form textarea { min-height: 70px; resize: vertical; }
  .paper-form .center { text-align: center; }
  .paper-form .footer-text { text-align: center; padding: 14px 10px; }
  .paper-form .footer-date { text-align: center; padding: 6px 10px; font-weight: 700; }
  .paper-form .signer-row { text-align: center; padding: 14px 10px; }
  .paper-form .checkbox-row label { display: inline-flex; align-items: center; gap: 4px; margin-right: 16px; font-size: 13px; cursor: pointer; }
  .paper-form .checkbox-row input[type="checkbox"], .paper-form .checkbox-row input[type="radio"] { width: auto; }
  .paper-form .items-table td { text-align: center; }
  .paper-form .items-table td.desc-cell { text-align: left; }
  .paper-form .sum-row td { font-weight: 700; background: #f7f7f7; }

  .doc {
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; background: #fff;
  }
  .doc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; cursor: pointer; }
  .doc-top .doc-title { flex: 1; }
  .chev { color: #9aa79e; font-size: 11px; margin-left: 6px; }
  .doc-detail { margin-top: 4px; }
  .doc-title { font-size: 14px; font-weight: 700; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .badge.draft { background: #eef0ee; color: #6b7a71; }
  .badge.fulfill-pending { background: #fdeee0; color: #b5641f; }
  .badge.fulfill-done { background: var(--green-soft); color: var(--green-deep); }
  .badge.pending { background: var(--amber-soft); color: var(--amber); }
  .badge.approved { background: var(--green-soft); color: var(--green-deep); }
  .badge.rejected { background: var(--red-soft); color: var(--red); }
  .doc-meta { font-size: 12px; color: #9aa79e; margin-bottom: 8px; }
  .doc-steps { margin-top: 10px; font-size: 12px; color: #4c6a58; display: flex; gap: 6px; flex-wrap: wrap; }
  .step-chip { padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .step-chip.approved { border-color: var(--green); color: var(--green-deep); }
  .step-chip.rejected { border-color: var(--red); color: var(--red); }
  .step-chip.waiting { border-color: var(--amber); color: var(--amber); }
  .att-list { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .att-chip { font-size: 11px; padding: 4px 8px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); color: #4c6a58; text-decoration: none; }

  .empty { text-align: center; color: #9aa79e; padding: 40px 0; font-size: 13px; }
  .msg { margin-top: 12px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
  .msg.show { display: block; }
  .msg.error { background: var(--red-soft); color: var(--red); }
  .msg.ok { background: var(--green-soft); color: var(--green-deep); }

  .leave-card {
    background: linear-gradient(135deg, var(--green-deep), var(--green)); color: #fff;
    border-radius: 14px; padding: 18px 20px; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .leave-card .num { font-size: 24px; font-weight: 800; }
  .leave-card .lbl { font-size: 11px; opacity: .85; margin-top: 2px; }
  .leave-card .stat { text-align: center; }

  .print-btn { font-size: 12px; padding: 6px 12px; }

  .a4-page {
    background: #fff; width: 100%; aspect-ratio: 210 / 297; max-width: 840px;
    padding: 16mm 14mm; box-shadow: 0 6px 24px rgba(0,0,0,.28); overflow-y: auto;
  }
  .a4-page .paper-form { box-shadow: none; max-width: 100%; }
  @media (max-width: 700px) {
    .a4-page { aspect-ratio: auto; padding: 6mm; }
  }

  /* ---- 인쇄 전용 (A4) ---- */
  #print-area { display: none; }
  @page { size: A4; margin: 14mm; }
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area {
      display: block; position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0;
    }
    #print-area .paper-form { box-shadow: none; max-width: 100%; border: 1.5px solid #000; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark">GTR</div><div class="name">전자결의</div></div>
  <div class="who"><span id="who-name"></span><a id="admin-link" href="/admin.html" style="display:none; font-size:12px; color:var(--green-deep); margin-left:12px; text-decoration:underline;">관리자 페이지</a><span class="logout" id="logout-btn">로그아웃</span></div>
</header>

<div class="wrap">
  <div class="tabs" id="main-tabs">
    <div class="tab active" data-panel="new">새 문서 작성</div>
    <div class="tab" data-panel="my">내 문서</div>
    <div class="tab" data-panel="approve">결재할 문서</div>
    <div class="tab" data-panel="history">완료된 문서</div>
  </div>

  <!-- 새 문서 작성 -->
  <div class="panel active" id="panel-new">
    <div class="doctype-picker" id="doctype-picker"></div>

    <div id="form-render"></div>

    <div id="attachment-area" class="card" style="display:none; margin-top:12px;">
      <label style="font-size:13px; font-weight:700; display:block; margin-bottom:8px;">영수증 첨부 (사진 또는 PDF, 여러 장 가능)</label>
      <input type="file" id="file-input" accept="image/jpeg,image/png,application/pdf" multiple />
      <div class="file-list" id="file-list"></div>
    </div>

    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="primary" id="save-btn">저장하고 미리보기</button>
    </div>
    <div class="msg" id="new-msg"></div>
  </div>

  <!-- 미리보기 모달 -->
  <div id="preview-modal" style="display:none; position:fixed; inset:0; background:#4a4f4b; z-index:50; align-items:flex-start; justify-content:center; padding:24px; overflow-y:auto;">
    <div style="width:100%; max-width:840px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
        <h2 style="font-size:14px; margin:0; color:#f0f0ec;">미리보기 — 임시저장되었습니다. 실제 출력될 모양입니다.</h2>
        <div style="display:flex; gap:8px;">
          <button class="ghost" id="preview-print-btn">인쇄</button>
          <button class="ghost" id="preview-close-btn">닫고 계속 수정하기</button>
          <button class="primary" id="preview-submit-btn">이 내용으로 상신하기</button>
        </div>
      </div>
      <div class="a4-page" id="preview-body"></div>
      <div class="msg" id="preview-msg" style="max-width:840px;"></div>
    </div>
  </div>

  <!-- 내 문서 -->
  <div class="panel" id="panel-my">
    <div id="leave-summary-card"></div>
    <div class="doctype-picker" id="my-filter"></div>
    <div id="my-list"></div>
  </div>

  <!-- 결재할 문서 -->
  <div class="panel" id="panel-approve">
    <div class="doctype-picker" id="approve-filter"></div>
    <div id="approve-list"></div>
  </div>

  <!-- 완료된 문서 -->
  <div class="panel" id="panel-history">
    <div class="doctype-picker" id="history-filter"></div>
    <div id="history-list"></div>
  </div>

  <!-- 전체 조회 (팀장/개발이사/회계담당/경영지원팀장 전용) -->
  <div class="panel" id="panel-scope">
    <div class="doctype-picker" id="scope-filter"></div>
    <div id="scope-list"></div>
  </div>
</div>

<div id="print-area"></div>

<script>
  const token = localStorage.getItem('gtr_approval_token');
  const employeeRaw = localStorage.getItem('gtr_approval_employee');
  if (!token) window.location.href = '/index.html';
  const employee = employeeRaw ? JSON.parse(employeeRaw) : {};
  document.getElementById('who-name').textContent = (employee.name || '') + '님';
  if (employee.is_master) {
    document.getElementById('admin-link').style.display = 'inline';
  }

  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('gtr_approval_token');
    localStorage.removeItem('gtr_approval_employee');
    window.location.href = '/index.html';
  });

  function authHeaders(json) {
    const h = { Authorization: 'Bearer ' + token };
    if (json) h['Content-Type'] = 'application/json';
    return h;
  }
  function esc(v) {
    return (v === undefined || v === null) ? '' : String(v).replace(/"/g, '&quot;');
  }
  function fmtNum(n) {
    const v = Number(n) || 0;
    return v.toLocaleString('ko-KR');
  }
  const printStore = {};
  function printDoc(key) {
    const html = printStore[key];
    if (!html) return;
    document.getElementById('print-area').innerHTML = html;
    window.print();
  }
  function toggleDetail(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const opening = el.style.display === 'none' || !el.style.display;
    el.style.display = opening ? 'block' : 'none';
    const chev = document.getElementById('chev-' + id);
    if (chev) chev.textContent = opening ? '▴' : '▾';
  }

  // ---------- 탭 전환 ----------
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.panel');
  tabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      tabs.forEach((t) => t.classList.remove('active'));
      panels.forEach((p) => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
      if (tab.dataset.panel === 'my') loadMyDocuments();
      if (tab.dataset.panel === 'approve') loadPendingApprovals();
      if (tab.dataset.panel === 'history') loadHistoryDocuments();
      if (tab.dataset.panel === 'scope') loadScopeDocuments();
    });
  });

  // 팀장/개발이사/회계담당만 "전체 조회" 탭 노출
  if (employee.is_team_leader || employee.is_dev_director || employee.is_accounting_reviewer) {
    const scopeTab = document.createElement('div');
    scopeTab.className = 'tab';
    scopeTab.dataset.panel = 'scope';
    scopeTab.textContent = '전체 조회';
    scopeTab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
      scopeTab.classList.add('active');
      document.getElementById('panel-scope').classList.add('active');
      loadScopeDocuments();
    });
    document.getElementById('main-tabs').appendChild(scopeTab);
  }

  // ======================================================
  // 문서 양식 정의
  // ======================================================
  const DOC_DEFS = {
    vacation: { name: '휴가신청서', roles: ['작성자', '개발이사', '담당'] },
    expense: { name: '지출결의서', roles: ['작성자', '개발이사', '차장', '담당'] },
    purchase: { name: '구매요청서', roles: ['작성자', '개발이사', '대표이사', '담당'] },
  };

  function approvalBoxHtml(code, realSteps) {
    if (realSteps && realSteps.length > 0) {
      const statusMark = { pending: '대기', waiting: '결재중', approved: '승인', rejected: '반려' };
      return `
        <table class="approval-table" style="width:100%;">
          <tr>${realSteps.map((s) => `<td class="role">${s.step_name.replace(' 승인', '')}</td>`).join('')}</tr>
          <tr>
            ${realSteps.map((s) => {
              const name = s.approval_employees ? s.approval_employees.name : '';
              return `<td class="stamp">${esc(name)}<br/><span style="font-size:10px;">${statusMark[s.status] || s.status}</span></td>`;
            }).join('')}
          </tr>
        </table>
      `;
    }
    const roles = DOC_DEFS[code].roles;
    return `
      <table class="approval-table" style="width:100%;">
        <tr>${roles.map((r) => `<td class="role">${r}</td>`).join('')}</tr>
        <tr>
          <td class="stamp">${esc(employee.name)}</td>
          ${roles.slice(1).map(() => `<td class="stamp">결재예정</td>`).join('')}
        </tr>
      </table>
    `;
  }

  function titleRow(code, realSteps) {
    return `
      <table>
        <tr class="title-row">
          <td style="width:70%;" class="title-cell">${DOC_DEFS[code].name}</td>
          <td style="width:30%; padding:8px;">${approvalBoxHtml(code, realSteps)}</td>
        </tr>
      </table>
    `;
  }

  // ---------- 휴가신청서 ----------
  function renderVacationForm(data, editable, steps) {
    const d = data || {};
    const inp = (key, type, extra) => editable
      ? `<input data-field="${key}" type="${type || 'text'}" value="${esc(d[key])}" ${extra || ''} />`
      : `<span>${esc(d[key]) || '-'}</span>`;
    const chk = (key, val, label) => {
      const checked = d[key] === val ? 'checked' : '';
      return editable
        ? `<label><input type="radio" name="f_${key}" data-field="${key}" value="${val}" ${checked} /> ${label}</label>`
        : `<label>${d[key] === val ? '☑' : '☐'} ${label}</label>`;
    };
    return `
      <div class="paper-form">
        ${titleRow('vacation', steps)}
        <table>
          <tr>
            <td class="label">성명</td><td>${editable ? esc(employee.name) : esc(d.name || employee.name)}</td>
            <td class="label">부서</td><td>${deptSelectHtml(d.department, editable)}</td>
            <td class="label">직급</td><td>${inp('position')}</td>
          </tr>
          <tr>
            <td class="label">구분</td>
            <td colspan="5" class="checkbox-row">
              ${chk('vacation_type', '연차', '연차')}
              ${chk('vacation_type', '반차', '반차')}
              ${chk('half', '오전', '오전')}
              ${chk('half', '오후', '오후')}
            </td>
          </tr>
          <tr>
            <td class="label">휴가기간</td>
            <td colspan="5">
              <div style="display:flex; align-items:center; gap:6px;">
                ${inp('start_date', 'date')} <span>~</span> ${inp('end_date', 'date')}
              </div>
            </td>
          </tr>
          <tr>
            <td class="label">내용</td>
            <td colspan="5">${editable ? `<textarea data-field="reason">${esc(d.reason)}</textarea>` : `<div>${esc(d.reason) || '-'}</div>`}</td>
          </tr>
          <tr><td colspan="6" class="footer-text">위와 같은 내용으로 휴가를 신청합니다.</td></tr>
          <tr><td colspan="6" class="footer-date">${new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })}</td></tr>
          <tr><td colspan="6" class="signer-row">신청인 : ${esc(employee.name)} (인)</td></tr>
        </table>
      </div>
    `;
  }

  // ---------- 지출결의서 / 구매요청서 (항목 테이블형) ----------
  function itemsTableHtml(code, data, editable) {
    const items = (data && data.items) || [];
    const cols = code === 'expense'
      ? [['date', '날짜', 'date'], ['vendor', '업체명', 'text'], ['amount', '금액', 'number'], ['description', '지출내용', 'text']]
      : [['item_name', '품명', 'text'], ['qty', '수량', 'number'], ['unit_price', '단가', 'number'], ['vendor', '구입처', 'text']];

    const total = items.reduce((sum, it) => {
      if (code === 'expense') return sum + (Number(it.amount) || 0);
      return sum + (Number(it.qty) || 0) * (Number(it.unit_price) || 0);
    }, 0);

    let head = `<tr>${code === 'purchase' ? '<th style="width:36px;">No.</th>' : ''}${cols.map(([k, l]) => `<th>${l}</th>`).join('')}${code === 'purchase' ? '<th>금액</th>' : ''}${editable ? '<th style="width:30px;"></th>' : ''}</tr>`;

    let rows = items.map((it, idx) => {
      const cells = cols.map(([k, l, type]) => {
        const val = it[k];
        if (!editable) return `<td class="${k === 'description' ? 'desc-cell' : ''}">${type === 'number' ? fmtNum(val) : (esc(val) || '-')}</td>`;
        return `<td><input data-row="${idx}" data-col="${k}" type="${type}" value="${esc(val)}" /></td>`;
      }).join('');
      const amountCell = code === 'purchase'
        ? `<td>${fmtNum((Number(it.qty) || 0) * (Number(it.unit_price) || 0))}</td>`
        : '';
      const noCell = code === 'purchase' ? `<td>${idx + 1}</td>` : '';
      const delCell = editable ? `<td><button type="button" class="row-del" data-del-row="${idx}">×</button></td>` : '';
      return `<tr>${noCell}${cells}${amountCell}${delCell}</tr>`;
    }).join('');

    if (items.length === 0) {
      rows = `<tr><td colspan="${cols.length + (code === 'purchase' ? 2 : 0) + (editable ? 1 : 0)}" style="text-align:center; color:#9aa79e;">${editable ? '아래 "+ 행 추가" 버튼으로 항목을 넣어주세요' : '항목 없음'}</td></tr>`;
    }

    const sumLabel = code === 'expense' ? '계' : '합계';
    const sumRow = `<tr class="sum-row"><td colspan="${(code === 'purchase' ? 1 : 0) + 1}">${sumLabel}</td><td colspan="${cols.length - 1 + (code === 'purchase' ? 1 : 0) + (editable ? 1 : 0)}" style="text-align:right;">${fmtNum(total)} 원</td></tr>`;

    return { html: `<table class="items-table">${head}${rows}${sumRow}</table>`, total };
  }

  function renderExpenseForm(data, editable, steps) {
    const d = data || { items: [] };
    const { html: tableHtml, total } = itemsTableHtml('expense', d, editable);
    const inp = (key) => editable
      ? `<input data-field="${key}" value="${esc(d[key])}" />`
      : `<span>${esc(d[key]) || '-'}</span>`;
    return `
      <div class="paper-form">
        ${titleRow('expense', steps)}
        <table>
          <tr>
            <td class="label">부서명</td><td>${deptSelectHtml(d.department, editable)}</td>
            <td class="label">직급</td><td>${inp('position')}</td>
            <td class="label">성명</td><td>${editable ? esc(employee.name) : esc(d.name || employee.name)}</td>
          </tr>
          <tr>
            <td class="label">지출금액</td>
            <td colspan="5">일금 ${fmtNum(total)} 원정 (₩ ${fmtNum(total)})</td>
          </tr>
        </table>
        ${tableHtml}
        <table>
          <tr><td colspan="6" class="footer-text">위 금액을 청구하오니 결재바랍니다.</td></tr>
          <tr><td colspan="6" class="footer-date">${new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })}</td></tr>
          <tr><td colspan="6" class="signer-row">영수인 : ${esc(employee.name)} (인)</td></tr>
        </table>
      </div>
      ${editable ? '<button type="button" class="ghost row-add" id="add-row-btn">+ 행 추가</button>' : ''}
    `;
  }

  function renderPurchaseForm(data, editable, steps) {
    const d = data || { items: [] };
    const { html: tableHtml } = itemsTableHtml('purchase', d, editable);
    const inp = (key, type) => editable
      ? `<input data-field="${key}" type="${type || 'text'}" value="${esc(d[key])}" />`
      : `<span>${esc(d[key]) || '-'}</span>`;
    return `
      <div class="paper-form">
        ${titleRow('purchase', steps)}
        <table>
          <tr>
            <td class="label">신청일자</td><td>${inp('request_date', 'date')}</td>
            <td class="label">신청자</td><td>${editable ? esc(employee.name) : esc(d.requester || employee.name)}</td>
          </tr>
          <tr>
            <td class="label">소속</td><td>${deptSelectHtml(d.department, editable)}</td>
            <td class="label">용도</td><td>${inp('purpose')}</td>
          </tr>
        </table>
        ${tableHtml}
        <table>
          <tr><td colspan="6" class="footer-text">상기 내용에 대한 구매를 요청합니다.</td></tr>
          <tr><td colspan="6" class="footer-date">${new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })}</td></tr>
          <tr><td colspan="6" class="signer-row">신청인 : ${esc(employee.name)} (인)</td></tr>
        </table>
      </div>
      ${editable ? '<button type="button" class="ghost row-add" id="add-row-btn">+ 행 추가</button>' : ''}
    `;
  }

  const FORM_RENDERERS = { vacation: renderVacationForm, expense: renderExpenseForm, purchase: renderPurchaseForm };

  // ---------- 새 문서 작성 상태 ----------
  let currentDocCode = 'vacation';
  let formData = {};
  let selectedFiles = [];
  let departmentList = [];
  let draftDocumentId = null;
  let filesUploaded = false;

  async function loadDepartments() {
    try {
      const res = await fetch('/api/departments', { headers: authHeaders() });
      const data = await res.json();
      departmentList = data.departments || [];
    } catch (e) {
      departmentList = [];
    }
  }

  function deptSelectHtml(currentValue, editable) {
    if (!editable) return `<span>${esc(currentValue) || '-'}</span>`;
    const options = departmentList.map((d) =>
      `<option value="${esc(d.name)}" ${d.name === currentValue ? 'selected' : ''}>${esc(d.name)}</option>`
    ).join('');
    return `<select data-field="department"><option value="">부서 선택</option>${options}</select>`;
  }

  function blankFormData() {
    const base = currentDocCode === 'vacation' ? {} : { items: [] };
    if (employee.department_name) base.department = employee.department_name;
    return base;
  }

  function buildDoctypePicker() {
    const picker = document.getElementById('doctype-picker');
    picker.innerHTML = Object.keys(DOC_DEFS).map((code) =>
      `<div class="doctype-btn ${code === currentDocCode ? 'active' : ''}" data-code="${code}">${DOC_DEFS[code].name}</div>`
    ).join('');
    picker.querySelectorAll('.doctype-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentDocCode = btn.dataset.code;
        formData = blankFormData();
        selectedFiles = [];
        draftDocumentId = null;
        filesUploaded = false;
        document.getElementById('file-list').textContent = '';
        document.getElementById('file-input').value = '';
        buildDoctypePicker();
        renderCurrentForm();
      });
    });
  }

  function renderCurrentForm() {
    const html = FORM_RENDERERS[currentDocCode](formData, true);
    document.getElementById('form-render').innerHTML = html;
    document.getElementById('attachment-area').style.display = currentDocCode === 'expense' ? 'block' : 'none';
    attachFormListeners();
  }

  function attachFormListeners() {
    const container = document.getElementById('form-render');

    container.querySelectorAll('[data-field]').forEach((el) => {
      const handler = () => { formData[el.dataset.field] = el.value; };
      el.addEventListener('input', handler);
      el.addEventListener('change', handler);
    });

    container.querySelectorAll('[data-row]').forEach((el) => {
      const handler = () => {
        const idx = Number(el.dataset.row);
        formData.items[idx][el.dataset.col] = el.value;
        renderCurrentForm(); // 합계 재계산을 위해 다시 그림
      };
      el.addEventListener('change', handler);
    });

    container.querySelectorAll('[data-del-row]').forEach((el) => {
      el.addEventListener('click', () => {
        formData.items.splice(Number(el.dataset.delRow), 1);
        renderCurrentForm();
      });
    });

    const addBtn = document.getElementById('add-row-btn');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        formData.items.push({});
        renderCurrentForm();
      });
    }
  }

  document.getElementById('file-input').addEventListener('change', (e) => {
    selectedFiles = Array.from(e.target.files);
    document.getElementById('file-list').textContent =
      selectedFiles.length > 0 ? selectedFiles.map((f) => f.name).join(', ') + ' 선택됨' : '';
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function showMsg(id, text, ok) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg show ' + (ok ? 'ok' : 'error');
  }

  function validateForm() {
    if (currentDocCode === 'vacation') {
      return formData.start_date && formData.end_date && formData.vacation_type;
    }
    return (formData.items || []).length > 0;
  }

  document.getElementById('save-btn').addEventListener('click', async () => {
    const btn = document.getElementById('save-btn');
    if (!validateForm()) {
      return showMsg('new-msg', '필수 항목을 입력해주세요.', false);
    }

    const title = `${DOC_DEFS[currentDocCode].name} - ${employee.name} - ${new Date().toLocaleDateString('ko-KR')}`;

    btn.disabled = true;
    try {
      const res = await fetch('/api/documents/create', {
        method: 'POST',
        headers: authHeaders(true),
        body: JSON.stringify({
          doc_type_code: currentDocCode,
          title,
          content: formData,
          action: 'draft',
          document_id: draftDocumentId,
        }),
      });
      const data = await res.json();
      if (!res.ok) return showMsg('new-msg', data.error || '저장에 실패했습니다.', false);
      draftDocumentId = data.document_id;

      if (!filesUploaded) {
        for (const file of selectedFiles) {
          const base64 = await fileToBase64(file);
          const fileType = file.type === 'application/pdf' ? 'pdf' : 'image';
          await fetch('/api/attachments/upload', {
            method: 'POST',
            headers: authHeaders(true),
            body: JSON.stringify({
              document_id: draftDocumentId,
              file_name: file.name,
              file_type: fileType,
              data_base64: base64,
            }),
          });
        }
        filesUploaded = true;
      }

      document.getElementById('new-msg').className = 'msg';
      openPreview();
    } catch (e) {
      showMsg('new-msg', '네트워크 오류가 발생했습니다.', false);
    } finally {
      btn.disabled = false;
    }
  });

  function openPreview() {
    const html = FORM_RENDERERS[currentDocCode](formData, false);
    document.getElementById('preview-body').innerHTML = html;
    document.getElementById('preview-modal').style.display = 'flex';
    document.getElementById('preview-msg').className = 'msg';
  }

  document.getElementById('preview-print-btn').addEventListener('click', () => {
    printStore['preview'] = document.getElementById('preview-body').innerHTML;
    printDoc('preview');
  });

  document.getElementById('preview-close-btn').addEventListener('click', () => {
    document.getElementById('preview-modal').style.display = 'none';
  });

  document.getElementById('preview-submit-btn').addEventListener('click', async () => {
    if (!draftDocumentId) return;
    const btn = document.getElementById('preview-submit-btn');
    const title = `${DOC_DEFS[currentDocCode].name} - ${employee.name} - ${new Date().toLocaleDateString('ko-KR')}`;
    btn.disabled = true;
    try {
      const res = await fetch('/api/documents/create', {
        method: 'POST',
        headers: authHeaders(true),
        body: JSON.stringify({
          doc_type_code: currentDocCode,
          title,
          content: formData,
          action: 'submit',
          document_id: draftDocumentId,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        const el = document.getElementById('preview-msg');
        el.textContent = data.error || '상신에 실패했습니다.';
        el.className = 'msg show error';
        return;
      }
      document.getElementById('preview-modal').style.display = 'none';
      showMsg('new-msg', '상신이 완료되었습니다.', true);
      draftDocumentId = null;
      filesUploaded = false;
      formData = blankFormData();
      selectedFiles = [];
      document.getElementById('file-list').textContent = '';
      document.getElementById('file-input').value = '';
      renderCurrentForm();
    } catch (e) {
      const el = document.getElementById('preview-msg');
      el.textContent = '네트워크 오류가 발생했습니다.';
      el.className = 'msg show error';
    } finally {
      btn.disabled = false;
    }
  });

  // ---------- 내 문서 ----------
  const draftStore = {};

  async function submitDraft(document_id) {
    const d = draftStore[document_id];
    if (!d) return;
    const res = await fetch('/api/documents/create', {
      method: 'POST',
      headers: authHeaders(true),
      body: JSON.stringify({
        doc_type_code: d.doc_type_code,
        title: d.title,
        content: d.content,
        action: 'submit',
        document_id,
      }),
    });
    const data = await res.json();
    if (res.ok) {
      loadMyDocuments();
    } else {
      alert(data.error || '상신 중 오류가 발생했습니다.');
    }
  }

  async function deleteMyDocument(document_id) {
    if (!confirm('이 문서를 삭제하시겠습니까? 삭제하면 되돌릴 수 없습니다.')) return;
    const res = await fetch('/api/documents/delete', {
      method: 'POST',
      headers: authHeaders(true),
      body: JSON.stringify({ document_id }),
    });
    const data = await res.json();
    if (res.ok) {
      loadMyDocuments();
    } else {
      alert(data.error || '삭제 중 오류가 발생했습니다.');
    }
  }

  const statusLabel = { draft: '임시저장', pending: '진행중', approved: '승인완료', rejected: '반려' };
  function fulfillmentBadge(d) {
    if (!d.fulfillment_status) return '';
    const map = {
      pending_payment: { text: '지급대기', cls: 'fulfill-pending' },
      paid: { text: '지급완료', cls: 'fulfill-done' },
      pending_purchase: { text: '구매대기', cls: 'fulfill-pending' },
      purchased: { text: '구매완료', cls: 'fulfill-done' },
    };
    const info = map[d.fulfillment_status];
    if (!info) return '';
    return `<span class="badge ${info.cls}">${info.text}</span>`;
  }
  const stepStatusLabel = { pending: '대기', waiting: '결재중', approved: '승인', rejected: '반려' };

  // ---------- 문서종류 필터 공통 헬퍼 ----------
  const filterState = { my: '', approve: '', history: '', scope: '' };
  function buildTypeFilter(containerId, key, onChange) {
    const el = document.getElementById(containerId);
    const options = [{ code: '', name: '전체' }, ...Object.keys(DOC_DEFS).map((c) => ({ code: c, name: DOC_DEFS[c].name }))];
    el.innerHTML = options.map((o) =>
      `<div class="doctype-btn ${o.code === filterState[key] ? 'active' : ''}" data-code="${o.code}">${o.name}</div>`
    ).join('');
    el.querySelectorAll('.doctype-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        filterState[key] = btn.dataset.code;
        buildTypeFilter(containerId, key, onChange);
        onChange();
      });
    });
  }

  async function loadLeaveSummary() {
    const el = document.getElementById('leave-summary-card');
    try {
      const res = await fetch('/api/documents/leave-summary', { headers: authHeaders() });
      const data = await res.json();
      if (!res.ok) { el.innerHTML = ''; return; }
      const allowanceText = data.allowance != null ? data.allowance + '일' : '미설정';
      const remainingText = data.remaining != null ? data.remaining + '일' : '-';
      el.innerHTML = `
        <div class="leave-card">
          <div>
            <div style="font-size:13px; font-weight:700;">${data.year}년 연차 현황</div>
            <div style="font-size:11px; opacity:.8; margin-top:2px;">휴가신청서 기준 자동 계산 (연차=1일, 반차=0.5일)</div>
          </div>
          <div style="display:flex; gap:24px;">
            <div class="stat"><div class="num">${allowanceText}</div><div class="lbl">총 부여</div></div>
            <div class="stat"><div class="num">${data.used}일</div><div class="lbl">사용</div></div>
            <div class="stat"><div class="num">${remainingText}</div><div class="lbl">잔여</div></div>
          </div>
        </div>
      `;
    } catch (e) {
      el.innerHTML = '';
    }
  }

  async function loadMyDocuments() {
    loadLeaveSummary();
    buildTypeFilter('my-filter', 'my', loadMyDocuments);
    const listEl = document.getElementById('my-list');
    listEl.innerHTML = '<div class="empty">불러오는 중...</div>';
    const qs = filterState.my ? ('?doc_type_code=' + encodeURIComponent(filterState.my)) : '';
    const res = await fetch('/api/documents/my' + qs, { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) { listEl.innerHTML = '<div class="empty">' + (data.error || '조회 실패') + '</div>'; return; }
    if (!data.documents || data.documents.length === 0) {
      listEl.innerHTML = '<div class="empty">해당하는 문서가 없습니다.</div>';
      return;
    }
    listEl.innerHTML = data.documents.map((d) => {
      const code = d.approval_doc_types ? d.approval_doc_types.code : 'vacation';
      const renderer = FORM_RENDERERS[code];
      const formHtml = renderer ? renderer(d.content, false, d.steps) : '';
      printStore['my-' + d.id] = formHtml;
      draftStore[d.id] = { doc_type_code: code, title: d.title, content: d.content };
      const canDelete = d.status === 'draft' || d.status === 'rejected';
      return `
        <div class="doc">
          <div class="doc-top" onclick="toggleDetail('my-detail-${d.id}')">
            <div class="doc-title">${d.title}<span class="chev" id="chev-my-detail-${d.id}">▾</span></div>
            <div style="display:flex; align-items:center; gap:8px;">
              <button class="ghost print-btn" onclick="event.stopPropagation(); printDoc('my-${d.id}')">인쇄</button>
              <div class="badge ${d.status}">${statusLabel[d.status] || d.status}</div>
              ${fulfillmentBadge(d)}
            </div>
          </div>
          <div class="doc-meta">${new Date(d.created_at).toLocaleString('ko-KR')}</div>
          <div id="my-detail-${d.id}" class="doc-detail" style="display:none;">
          ${formHtml}
          <div class="doc-steps">
            ${(d.steps || []).map((s) => `<span class="step-chip ${s.status}">${s.step_name}: ${stepStatusLabel[s.status] || s.status}</span>`).join('')}
          </div>
          <div style="margin-top:12px; display:flex; gap:8px;">
            ${d.status === 'draft' ? `<button class="approve" onclick="submitDraft('${d.id}')">상신하기</button>` : ''}
            ${canDelete ? `<button class="reject" onclick="deleteMyDocument('${d.id}')">삭제</button>` : ''}
          </div>
          </div>
        </div>
      `;
    }).join('');
  }

  // ---------- 결재할 문서 ----------
  async function loadPendingApprovals() {
    buildTypeFilter('approve-filter', 'approve', loadPendingApprovals);
    const listEl = document.getElementById('approve-list');
    listEl.innerHTML = '<div class="empty">불러오는 중...</div>';
    const qs = filterState.approve ? ('?doc_type_code=' + encodeURIComponent(filterState.approve)) : '';
    const res = await fetch('/api/documents/pending' + qs, { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) { listEl.innerHTML = '<div class="empty">' + (data.error || '조회 실패') + '</div>'; return; }
    if (!data.pending || data.pending.length === 0) {
      listEl.innerHTML = '<div class="empty">결재할 문서가 없습니다.</div>';
      return;
    }
    listEl.innerHTML = data.pending.map((s) => {
      const doc = s.approval_documents;
      const drafterName = doc && doc.approval_employees ? doc.approval_employees.name : '';
      const code = doc && doc.approval_doc_types ? doc.approval_doc_types.code : 'vacation';
      const renderer = FORM_RENDERERS[code];
      const formHtml = doc && renderer ? renderer(doc.content, false, s.all_steps) : '';
      if (doc) printStore['approve-' + doc.id] = formHtml;
      return `
        <div class="doc">
          <div class="doc-top" onclick="toggleDetail('approve-detail-${s.id}')">
            <div class="doc-title">${doc ? doc.title : ''}<span class="chev" id="chev-approve-detail-${s.id}">▾</span></div>
            <div style="display:flex; align-items:center; gap:8px;">
              ${doc ? `<button class="ghost print-btn" onclick="event.stopPropagation(); printDoc('approve-${doc.id}')">인쇄</button>` : ''}
              <div class="badge pending">${s.step_name}</div>
            </div>
          </div>
          <div class="doc-meta">기안자: ${drafterName}</div>
          <div id="approve-detail-${s.id}" class="doc-detail" style="display:none;">
          ${formHtml}
          <div id="att-${doc ? doc.id : ''}" class="att-list"></div>
          <div style="margin-top:12px; display:flex; gap:8px;">
            <button class="approve" onclick="act('${s.id}', 'approve')">승인</button>
            <button class="reject" onclick="act('${s.id}', 'reject')">반려</button>
          </div>
          </div>
        </div>
      `;
    }).join('');

    data.pending.forEach((s) => {
      const doc = s.approval_documents;
      if (doc) loadAttachments(doc.id);
    });
  }

  async function loadAttachments(document_id) {
    const el = document.getElementById('att-' + document_id);
    if (!el) return;
    const res = await fetch('/api/attachments/list?document_id=' + document_id, { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok || !data.attachments || data.attachments.length === 0) return;
    el.innerHTML = data.attachments.map((a) =>
      `<a class="att-chip" href="${a.url}" target="_blank" rel="noopener">${a.file_name}</a>`
    ).join('');
  }

  async function act(step_id, action) {
    let comment = null;
    if (action === 'reject') {
      comment = prompt('반려 사유를 입력해주세요 (선택)');
    }
    const res = await fetch('/api/documents/act', {
      method: 'POST',
      headers: authHeaders(true),
      body: JSON.stringify({ step_id, action, comment }),
    });
    if (res.ok) loadPendingApprovals();
    else alert('처리 중 오류가 발생했습니다.');
  }

  // ---------- 완료된 문서 ----------
  async function loadHistoryDocuments() {
    buildTypeFilter('history-filter', 'history', loadHistoryDocuments);
    const listEl = document.getElementById('history-list');
    listEl.innerHTML = '<div class="empty">불러오는 중...</div>';
    const qs = filterState.history ? ('?doc_type_code=' + encodeURIComponent(filterState.history)) : '';
    const res = await fetch('/api/documents/history' + qs, { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) { listEl.innerHTML = '<div class="empty">' + (data.error || '조회 실패') + '</div>'; return; }
    if (!data.documents || data.documents.length === 0) {
      listEl.innerHTML = '<div class="empty">완료된 문서가 없습니다.</div>';
      return;
    }
    listEl.innerHTML = data.documents.map((d) => {
      const code = d.approval_doc_types ? d.approval_doc_types.code : 'vacation';
      const renderer = FORM_RENDERERS[code];
      const formHtml = renderer ? renderer(d.content, false, d.steps) : '';
      printStore['history-' + d.id] = formHtml;
      const drafterName = d.approval_employees ? d.approval_employees.name : '';
      return `
        <div class="doc">
          <div class="doc-top" onclick="toggleDetail('history-detail-${d.id}')">
            <div class="doc-title">${d.title}<span class="chev" id="chev-history-detail-${d.id}">▾</span></div>
            <div style="display:flex; align-items:center; gap:8px;">
              <button class="ghost print-btn" onclick="event.stopPropagation(); printDoc('history-${d.id}')">인쇄</button>
              <div class="badge ${d.status}">${statusLabel[d.status] || d.status}</div>
              ${fulfillmentBadge(d)}
            </div>
          </div>
          <div class="doc-meta">작성자: ${drafterName} · ${new Date(d.created_at).toLocaleString('ko-KR')}</div>
          <div id="history-detail-${d.id}" class="doc-detail" style="display:none;">
          ${formHtml}
          <div class="doc-steps">
            ${(d.steps || []).map((s) => `<span class="step-chip ${s.status}">${s.step_name}: ${stepStatusLabel[s.status] || s.status}</span>`).join('')}
          </div>
          </div>
        </div>
      `;
    }).join('');
  }

  // ---------- 전체 조회 (팀장/개발이사/회계담당/경영지원팀장) ----------
  async function loadScopeDocuments() {
    buildTypeFilter('scope-filter', 'scope', loadScopeDocuments);
    const listEl = document.getElementById('scope-list');
    listEl.innerHTML = '<div class="empty">불러오는 중...</div>';
    const qs = filterState.scope ? ('?doc_type_code=' + encodeURIComponent(filterState.scope)) : '';
    const res = await fetch('/api/documents/scope' + qs, { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) { listEl.innerHTML = '<div class="empty">' + (data.error || '조회 실패') + '</div>'; return; }
    if (!data.documents || data.documents.length === 0) {
      listEl.innerHTML = '<div class="empty">해당하는 문서가 없습니다.</div>';
      return;
    }
    listEl.innerHTML = data.documents.map((d) => {
      const code = d.approval_doc_types ? d.approval_doc_types.code : 'vacation';
      const renderer = FORM_RENDERERS[code];
      const formHtml = renderer ? renderer(d.content, false, d.steps) : '';
      printStore['scope-' + d.id] = formHtml;
      const drafterName = d.approval_employees ? d.approval_employees.name : '';
      const canFulfill = employee.is_accounting_reviewer &&
        ['pending_payment', 'pending_purchase'].includes(d.fulfillment_status);
      return `
        <div class="doc">
          <div class="doc-top" onclick="toggleDetail('scope-detail-${d.id}')">
            <div class="doc-title">${d.title}<span class="chev" id="chev-scope-detail-${d.id}">▾</span></div>
            <div style="display:flex; align-items:center; gap:8px;">
              <button class="ghost print-btn" onclick="event.stopPropagation(); printDoc('scope-${d.id}')">인쇄</button>
              <div class="badge ${d.status}">${statusLabel[d.status] || d.status}</div>
              ${fulfillmentBadge(d)}
            </div>
          </div>
          <div class="doc-meta">작성자: ${drafterName} · ${new Date(d.created_at).toLocaleString('ko-KR')}</div>
          <div id="scope-detail-${d.id}" class="doc-detail" style="display:none;">
          ${formHtml}
          <div class="doc-steps">
            ${(d.steps || []).map((s) => `<span class="step-chip ${s.status}">${s.step_name}: ${stepStatusLabel[s.status] || s.status}</span>`).join('')}
          </div>
          ${canFulfill ? `<div style="margin-top:12px;"><button class="approve" onclick="event.stopPropagation(); fulfillDoc('${d.id}')">${d.fulfillment_status === 'pending_payment' ? '지급완료 처리' : '구매완료 처리'}</button></div>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  async function fulfillDoc(document_id) {
    if (!confirm('완료 처리하시겠습니까?')) return;
    const res = await fetch('/api/documents/fulfill', {
      method: 'POST',
      headers: authHeaders(true),
      body: JSON.stringify({ document_id }),
    });
    const data = await res.json();
    if (res.ok) loadScopeDocuments();
    else alert(data.error || '처리 중 오류가 발생했습니다.');
  }

  (async function init() {
    await loadDepartments();
    formData = blankFormData();
    buildDoctypePicker();
    renderCurrentForm();
  })();
</script>
</body>
</html>
