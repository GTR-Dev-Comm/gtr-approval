<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>지티알 전자결의</title>
<style>
  :root {
    --ink: #1b2621;
    --paper: #f6f5f0;
    --card: #ffffff;
    --line: #e2e0d6;
    --green-deep: #1f4d3a;
    --green: #2f7a54;
    --green-soft: #e7f0e9;
    --amber: #c98a2c;
    --red: #b5453f;
    --radius: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 400px; }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .brand .mark {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--green), var(--green-deep));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 15px;
  }
  .brand .name { font-size: 15px; color: #5b6a61; letter-spacing: .01em; }
  .brand .name b { color: var(--ink); font-weight: 700; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: 0 1px 2px rgba(27,38,33,.04);
  }
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--green-soft);
    padding: 4px;
    border-radius: 10px;
    margin-bottom: 22px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 0;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    color: #4c6a58;
    cursor: pointer;
    user-select: none;
    transition: background .15s, color .15s;
  }
  .tab.active { background: var(--green-deep); color: #fff; }

  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 700; }
  .sub { font-size: 13px; color: #7a8a80; margin: 0 0 22px; }

  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: #33413a; }
  input, select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 14px;
    background: #fbfbf9;
    color: var(--ink);
    outline: none;
  }
  input:focus, select:focus { border-color: var(--green); background: #fff; }

  button.primary {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border: none;
    border-radius: 9px;
    background: var(--green-deep);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button.primary:active { transform: translateY(1px); }
  button.primary:disabled { opacity: .5; cursor: default; }

  .msg {
    margin-top: 14px;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    display: none;
  }
  .msg.show { display: block; }
  .msg.error { background: #fbeceb; color: var(--red); }
  .msg.ok { background: var(--green-soft); color: var(--green-deep); }

  .panel { display: none; }
  .panel.active { display: block; }

  footer {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: #9aa79e;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark">GTR</div>
    <div class="name"><b>지티알</b> 전자결의</div>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" data-panel="login">로그인</div>
      <div class="tab" data-panel="signup">가입 신청</div>
    </div>

    <!-- 로그인 -->
    <div class="panel active" id="panel-login">
      <h1>로그인</h1>
      <p class="sub">발급받은 아이디와 비밀번호로 로그인하세요.</p>
      <label>아이디</label>
      <input id="login-id" autocomplete="username" />
      <label>비밀번호</label>
      <input id="login-pw" type="password" autocomplete="current-password" />
      <button class="primary" id="login-btn">로그인</button>
      <div class="msg" id="login-msg"></div>
    </div>

    <!-- 가입 신청 -->
    <div class="panel" id="panel-signup">
      <h1>가입 신청</h1>
      <p class="sub">아이디와 비밀번호를 직접 정해서 신청하면, 관리자 승인 후 로그인할 수 있습니다.</p>
      <label>이름</label>
      <input id="signup-name" />
      <label>소속 부서</label>
      <select id="signup-dept"><option value="">부서를 선택하세요</option></select>
      <label>아이디 (4자 이상)</label>
      <input id="signup-id" autocomplete="username" />
      <label>비밀번호 (6자 이상)</label>
      <input id="signup-pw" type="password" autocomplete="new-password" />
      <button class="primary" id="signup-btn">가입 신청하기</button>
      <div class="msg" id="signup-msg"></div>
    </div>
  </div>

  <footer>GTR 파크골프 · 전자결의 시스템</footer>
</div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.panel');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    });
  });

  function showMsg(id, text, ok) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg show ' + (ok ? 'ok' : 'error');
  }

  // 부서 목록 불러오기
  fetch('/api/departments')
    .then(r => r.json())
    .then(data => {
      const sel = document.getElementById('signup-dept');
      (data.departments || []).forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.name;
        sel.appendChild(opt);
      });
    })
    .catch(() => {});

  document.getElementById('login-btn').addEventListener('click', async () => {
    const btn = document.getElementById('login-btn');
    const login_id = document.getElementById('login-id').value.trim();
    const password = document.getElementById('login-pw').value;
    if (!login_id || !password) return showMsg('login-msg', '아이디와 비밀번호를 입력해주세요.', false);
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login_id, password }),
      });
      const data = await res.json();
      if (!res.ok) return showMsg('login-msg', data.error || '로그인에 실패했습니다.', false);
      localStorage.setItem('gtr_approval_token', data.token);
      localStorage.setItem('gtr_approval_employee', JSON.stringify(data.employee));
      showMsg('login-msg', '로그인되었습니다. 이동 중...', true);
      // 다음 단계에서 만들 결재함 화면으로 이동 예정
      setTimeout(() => { window.location.href = '/dashboard.html'; }, 600);
    } catch (e) {
      showMsg('login-msg', '네트워크 오류가 발생했습니다.', false);
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('signup-btn').addEventListener('click', async () => {
    const btn = document.getElementById('signup-btn');
    const name = document.getElementById('signup-name').value.trim();
    const department_id = document.getElementById('signup-dept').value || null;
    const login_id = document.getElementById('signup-id').value.trim();
    const password = document.getElementById('signup-pw').value;
    if (!name || !login_id || !password) return showMsg('signup-msg', '이름, 아이디, 비밀번호를 입력해주세요.', false);
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, department_id, login_id, password }),
      });
      const data = await res.json();
      if (!res.ok) return showMsg('signup-msg', data.error || '가입 신청에 실패했습니다.', false);
      showMsg('signup-msg', data.message, true);
    } catch (e) {
      showMsg('signup-msg', '네트워크 오류가 발생했습니다.', false);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
